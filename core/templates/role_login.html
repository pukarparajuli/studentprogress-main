{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header text-center">
                <h3>{{ role|title }} Login</h3>
                <p class="text-muted">Enter your credentials to access the {{ role }} portal</p>
            </div>
            <div class="card-body">
                <form method="post">
                    <input type="hidden" name="role" value="{{ role }}">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login as {{ role|title }}</button>
                    </div>
                </form>
                
                <div class="text-center mt-3">
                    <a href="{% url 'home' %}" class="text-muted">← Back to role selection</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
